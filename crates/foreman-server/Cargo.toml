[package]
name = "foreman-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "foreman-server"
path = "src/main.rs"

[dependencies]
foreman-core = { path = "../foreman-core" }
spoolman-rs = { path = "../spoolman-rs" }

# Async runtime
tokio = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }

# Serialisation
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Config
config = { workspace = true }

# Type generation
ts-rs = { workspace = true }

# Utilities
chrono = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }

# WebSocket futures helper
futures-util = "0.3"

# Database (for SqlitePool type in shared state)
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio"] }

# HTTP client (snapshot proxy)
reqwest = { workspace = true }

# SSH / SFTP (task 2.5)
russh = { workspace = true }
russh-sftp = { workspace = true }
tokio-util = { workspace = true }

# URL parsing (path failover health checks)
url = "2"

# Dual-stack listener (IPV6_V6ONLY=false)
socket2 = "0.6"

# Hidden password prompt for `reset-admin`
rpassword = { workspace = true }

# LAN announce + own addresses for /api/info
mdns-sd = { workspace = true }
if-addrs = { workspace = true }

[dev-dependencies]
tempfile = "3"
async-trait = { workspace = true }
tower = { workspace = true, features = ["util"] }
