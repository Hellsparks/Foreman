[package]
name = "foreman-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Foreman print farm server (headless)"

[[bin]]
name = "foreman-server"
path = "src/main.rs"

[dependencies]
foreman-core = { path = "../foreman-core" }
spoolman-rs = { path = "../spoolman-rs" }
foreman-swatch = { path = "../foreman-swatch" }

# Async runtime
tokio = { workspace = true }

# Web framework
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true }

# Serialisation
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Config
config = { workspace = true }

# Type generation
ts-rs = { workspace = true }

# Utilities
chrono = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }

# WebSocket futures helper
futures-util = "0.3"

# Database (for SqlitePool type in shared state)
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio"] }

# HTTP client (snapshot proxy)
reqwest = { workspace = true }

# SSH / SFTP (task 2.5)
russh = { workspace = true }
russh-sftp = { workspace = true }
tokio-util = { workspace = true }
zip = { workspace = true }
# Passphrase-encrypted backups (age format; `age -d` opens them by hand)
age = "0.11"

# URL parsing (path failover health checks)
url = "2"

# Dual-stack listener (IPV6_V6ONLY=false)
socket2 = "0.6"
async-trait = { workspace = true }

# Hidden password prompt for `reset-admin`
rpassword = { workspace = true }

# LAN announce + own addresses for /api/info
mdns-sd = { workspace = true }
if-addrs = { workspace = true }

[dev-dependencies]
tempfile = "3"
tower = { workspace = true, features = ["util"] }

[package.metadata.dist]
# The web UI, staged by the release workflow (frontend/dist copied here).
include = ["../../target/release-web/frontend/"]

# `cargo deb -p foreman-server` (release workflow): the headless server as a
# systemd service running as user `foreman`, data in /var/lib/foreman.
[package.metadata.deb]
name = "foreman-server"
maintainer = "Foreman Contributors"
copyright = "Foreman Contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
Foreman manages a print farm: Klipper/Moonraker, Bambu and Prusa printers, a \
Spoolman-compatible filament inventory, a print library and queue. This package \
runs the headless server as the systemd service `foreman` on port 9090."""
section = "net"
priority = "optional"
depends = "$auto"
maintainer-scripts = "debian/"
assets = [
    ["target/release/foreman-server", "usr/bin/", "755"],
    ["../../target/release-web/frontend/**/*", "usr/share/foreman/frontend/", "644"],
    ["debian/default", "etc/default/foreman", "644"],
    ["../../README.md", "usr/share/doc/foreman-server/README.md", "644"],
]
systemd-units = { unit-name = "foreman", enable = true, start = true }
