[package]
name = "foreman-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
ts-rs = { workspace = true }

# Async traits
async-trait = { workspace = true }

# WebSocket (Moonraker JSON-RPC)
tokio-tungstenite = { workspace = true }
url = { workspace = true }
futures-util = { workspace = true }

# MQTT (Bambu LAN driver)
rumqttc = { workspace = true }

# TLS cert fingerprinting (TOFU pinning)
sha2 = { workspace = true }
hex = { workspace = true }

# FTPS (Bambu SD card file ops — sync API in spawn_blocking)
suppaftp = { workspace = true }
native-tls = { workspace = true }

# Database (Foreman-native SQLite store)
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "chrono"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
rumqttc = { workspace = true }
toml = "0.8"
