[package]
name = "foreman-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
ts-rs = { workspace = true }

# Async traits
async-trait = { workspace = true }

# WebSocket (Moonraker JSON-RPC)
tokio-tungstenite = { workspace = true }
url = { workspace = true }
futures-util = { workspace = true }

# MQTT (Bambu LAN driver)
rumqttc = { workspace = true }

# TLS cert fingerprinting (TOFU pinning)
sha2 = { workspace = true }
hex = { workspace = true }

# FTPS (Bambu SD card file ops — sync API in spawn_blocking)
suppaftp = { workspace = true }
native-tls = { workspace = true }

# HTTP client (Moonraker command dispatch)
reqwest = { workspace = true }

# SSH / SFTP (task 2.5)
russh = { workspace = true }
russh-sftp = { workspace = true }
base64 = { workspace = true }
rand_core = { workspace = true }
getrandom = { workspace = true }
ssh-key = { workspace = true }
aes-gcm = { workspace = true }

# Admin password hashing (Argon2id)
argon2 = { workspace = true }

# Database (Foreman-native SQLite store)
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "chrono"] }

# Library: 3MF (zip + XML), binary G-code, STL thumbnails (task 3.1)
zip = { workspace = true }
quick-xml = { workspace = true }
binarygcode = { workspace = true }
stl_io = { workspace = true }
png = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
rumqttc = { workspace = true }
toml = "0.8"
