[package]
name = "spoolman-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "spoolman-rs"
path = "src/bin/main.rs"

[dependencies]
foreman-core = { path = "../foreman-core" }

# Async runtime
tokio = { workspace = true }

# Web
axum = { workspace = true }
tower-http = { workspace = true }

# Database — all three engines + type-erased pool.
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "sqlite",
    "postgres",
    "mysql",
    "tls-rustls",
    "any",
] }

# Serialisation
serde = { workspace = true }
serde_json = { workspace = true }

# Date/time
chrono = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Async futures utilities (needed for WebSocket split)
futures-util = "0.3"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# OS paths (for default data dir matching upstream platformdirs)
dirs = { workspace = true }

[dev-dependencies]
# Temporary directories for database tests
tempfile = "3"
# HTTP client for route-list integration test
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# JSON for route fixture
serde_json = "1"
