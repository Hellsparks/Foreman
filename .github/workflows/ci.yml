name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Never let rustup auto-install components during CI builds
  RUSTUP_AUTO_INSTALL: "0"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # foreman-desktop (Tauri) links WebKitGTK + the tray's appindicator on Linux.
      # Windows needs nothing extra. Retries ride out flaky Ubuntu mirrors.
      - name: Install Tauri system libraries (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 &&
               sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
                 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # 0.4 — Type-gen drift check (Linux only; Windows has the same Rust output)
      - name: type-gen drift check
        if: runner.os == 'Linux'
        run: git diff --exit-code frontend/src/api/types/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        working-directory: frontend
        run: npm ci

      - name: Type check + build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test --if-present
