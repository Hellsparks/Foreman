[workspace]
members = [
    "crates/foreman-core",
    "crates/spoolman-rs",
    "crates/foreman-server",
    "crates/foreman-desktop",
    "crates/foreman-swatch",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Foreman Contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Hellsparks/Foreman"
homepage = "https://github.com/Hellsparks/Foreman"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
config = "0.14"

# Type generation
ts-rs = { version = "10", features = ["serde-compat", "chrono-impl"] }

# Utilities
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["io"] }
dirs = "5"
async-trait = "0.1"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
url = "2"
futures-util = "0.3"
rumqttc = { version = "0.24", features = ["use-rustls"] }
sha2 = "0.10"
hex = "0.4"
suppaftp = { version = "6", features = ["native-tls", "deprecated"] }
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

# SSH / SFTP (task 2.5)
russh = "0.65"
russh-sftp = "2"
base64 = "0.22"
# rand_core 0.10 + rand_core feature on ssh-key enables PrivateKey::random for ed25519 keygen
rand_core = "0.10"
getrandom = "0.4"
ssh-key = { version = "=0.7.0-rc.11", features = ["rand_core", "ed25519"] }
# At-rest encryption of the SSH private key + passwords (already in the tree via russh)
aes-gcm = "0.11"
# Admin password hashing (Argon2id; same version russh already pulls in)
argon2 = "0.6"
# Hidden password prompt for `foreman-server reset-admin`
rpassword = "7"
# LAN discovery (_foreman._tcp) + own-address listing for /api/info
mdns-sd = "0.21"
if-addrs = "0.15"
# Library parser (task 3.1): 3MF zip + XML, binary G-code (pure Rust libbgcode port),
# STL read + PNG encode for the software-rendered STL thumbnail
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
binarygcode = "0.0.3"
stl_io = "0.11"
png = "0.18"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Release archives and the .deb (dist + cargo-deb): same settings as release.
[profile.dist]
inherits = "release"

# Swatch generator (D8): the CSG / font / polygon crates are ~30x slower
# unoptimised. Build them optimised in dev and test too so swatches stay < 1 s.
[profile.dev.package.csgrs]
opt-level = 3
[profile.dev.package.foreman-swatch]
opt-level = 3
[profile.dev.package.i_overlay]
opt-level = 3
[profile.dev.package.geo]
opt-level = 3
[profile.dev.package.spade]
opt-level = 3
[profile.dev.package.nalgebra]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3

# Release archives for the headless server (dist / cargo-dist). Only
# foreman-server is distributed this way; the desktop app is built by Tauri and the
# .deb / Docker image by the release workflow. `dist plan` previews the result.
[workspace.metadata.dist]
cargo-dist-version = "0.33.1"
ci = "github"
# No installers: dist's shell installer copies only the binary, and the server
# needs its frontend/ folder beside it. The .deb and Docker image cover installs.
installers = []
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# .github/workflows/release.yml is hand-written (it also builds the desktop app,
# the .deb and the Docker image); dist builds the server archives inside it.
allow-dirty = ["ci"]
checksum = "sha256"
# Build only foreman-server (--package), not the Tauri app and its WebKit deps.
precise-builds = true
