[workspace]
members = [
    "crates/foreman-core",
    "crates/spoolman-rs",
    "crates/foreman-server",
    "crates/foreman-desktop",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Foreman Contributors"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
config = "0.14"

# Type generation
ts-rs = { version = "10", features = ["serde-compat", "chrono-impl"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["io"] }
dirs = "5"
async-trait = "0.1"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
url = "2"
futures-util = "0.3"
rumqttc = { version = "0.24", features = ["use-rustls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
