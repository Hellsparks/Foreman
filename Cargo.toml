[workspace]
members = [
    "crates/foreman-core",
    "crates/spoolman-rs",
    "crates/foreman-server",
    "crates/foreman-desktop",
    "xtask",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Foreman Contributors"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
config = "0.14"

# Type generation
ts-rs = { version = "10", features = ["serde-compat", "chrono-impl"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-util = { version = "0.7", features = ["io"] }
dirs = "5"
async-trait = "0.1"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
url = "2"
futures-util = "0.3"
rumqttc = { version = "0.24", features = ["use-rustls"] }
sha2 = "0.10"
hex = "0.4"
suppaftp = { version = "6", features = ["native-tls", "deprecated"] }
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

# SSH / SFTP (task 2.5)
russh = "0.65"
russh-sftp = "2"
base64 = "0.22"
# rand_core 0.10 + rand_core feature on ssh-key enables PrivateKey::random for ed25519 keygen
rand_core = "0.10"
getrandom = "0.4"
ssh-key = { version = "=0.7.0-rc.11", features = ["rand_core", "ed25519"] }
# At-rest encryption of the SSH private key + passwords (already in the tree via russh)
aes-gcm = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
